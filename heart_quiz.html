<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心臟解剖連線練習｜香港護理學會教材</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #f2f5f9;
    color: #182230;
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 28px #15223818;
  }
  h1 { margin: 0 0 8px; font-size: 1.7rem; }
  .hint { margin: 0 0 18px; color: #526174; line-height: 1.6; }
  select, button { font: inherit; }
  select {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: white;
  }
  .status {
    min-height: 28px;
    margin: 8px 0 12px;
    font-weight: 700;
  }
  .timer-box{
    background:#eef6ff;
    padding:10px 14px;
    border-radius:10px;
    margin-bottom:12px;
    font-weight:bold;
    color:#2868bd;
  }
  .img-wrap{
    width:100%;
    background:#f8fafc;
    border:1px solid #dbe3ec;
    border-radius:12px;
    padding:12px;
    margin-bottom:16px;
    text-align:center;
  }
  .img-wrap img{
    max-width:100%;
    max-height:420px;
    object-fit:contain;
  }
  .columns {
    display: grid;
    grid-template-columns: 0.75fr 1.6fr;
    gap: 12px;
  }
  .column-title {
    padding: 8px 10px;
    color: #526174;
    font-size: .9rem;
    font-weight: 700;
  }
  .item {
    width: 100%;
    min-height: 52px;
    margin-bottom: 8px;
    padding: 10px 12px;
    text-align: left;
    color: #182230;
    background: #f8fafc;
    border: 2px solid #dbe3ec;
    border-radius: 12px;
    cursor: pointer;
    transition: .15s;
  }
  .item:hover { border-color: #7398ce; }
  .item.selected {
    background: #e8f1ff;
    border-color: #3478d4;
  }
  .item.matched {
    color: #17633a;
    background: #e9f8ef;
    border-color: #68b884;
    cursor: default;
  }
  .item.wrong {
    background: #fff0f0;
    border-color: #e27676;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  .control {
    padding: 10px 14px;
    border: 0;
    border-radius: 10px;
    background: #e8edf4;
    cursor: pointer;
  }
  .control.primary { color: white; background: #2868bd; }
  .result-panel{
    margin-top:16px;
    padding:16px;
    background:#f0f7ff;
    border-radius:14px;
    display:none;
  }
  .note { margin-top: 16px; color: #64748b; font-size: .9rem; }
  @media (max-width: 520px) {
    body { padding: 10px; }
    main { padding: 16px; }
    .columns { grid-template-columns: 1fr 1fr; gap: 8px; }
    .item { padding: 9px; font-size: .93rem; }
    .img-wrap img{max-height:280px;}
  }
</style>
</head>
<body>
<main>
  <h1>心臟解剖連線練習｜香港護理學會教材</h1>
  <p class="hint">選擇題組，先點左邊的標示字母，再點右邊相對應的結構。答錯可以重複嘗試。</p>

  <label for="set"><strong>題組</strong></label>
  <select id="set">
    <option value="anterior">心臟前面觀 Anterior view</option>
    <option value="posterior">心臟後面觀 Posterior view</option>
    <option value="chambers">心臟腔室 Chambers of heart</option>
    <option value="valves">心臟瓣膜 Heart valves</option>
    <option value="vessels">心臟主要大血管 Major vessels</option>
    <option value="coronaryA">冠狀動脈供血 Coronary arterial</option>
    <option value="coronaryV">冠狀靜脈回流 Coronary venous</option>
    <option value="myocardium">心肌 Myocardium</option>
    <option value="conduction">心臟傳導系統</option>
    <option value="pericardium">心包 Pericardium</option>
  </select>

  <div class="timer-box">計時：<span id="timer">00:00</span>｜總嘗試次數：<span id="attemptCount">0</span></div>

  <!-- 解剖圖顯示區，放你PDF截圖 -->
  <div class="img-wrap">
    <img id="diagramImg" alt="心臟解剖圖">
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="columns">
    <section>
      <div class="column-title">標示字母</div>
      <div id="letters"></div>
    </section>
    <section>
      <div class="column-title">結構名稱（順序已打亂）</div>
      <div id="names"></div>
    </section>
  </div>

  <div class="controls">
    <button class="control primary" id="restart">重新開始</button>
    <button class="control" id="showAnswers">顯示答案</button>
  </div>

  <!-- 成績報告面板 -->
  <div class="result-panel" id="resultPanel">
    <h3>📋 本組成績報告</h3>
    <p>總題目：<span id="qTotal"></span></p>
    <p>答對：<span id="qCorrect"></span></p>
    <p>總嘗試次數：<span id="totalAttempts"></span></p>
    <p>得分：<span id="score"></span> 分</p>
    <p>耗時：<span id="usedTime"></span></p>
    <p>錯題記錄（多次錯誤都會記錄）：<div id="wrongList"></div></p>
  </div>

  <p class="note">📌 使用方法：將PDF入面每幅解剖圖截圖，改名為 anterior.jpg、posterior.jpg 等，同html檔放喺同一個資料夾。切換題組會自動載入對應圖片。</p>
</main>

<script>
const sets = {
  anterior: {
    name:"心臟前面觀 Anterior view",
    img:"anterior.jpg",
    pairs:[
      ["A", "右心房 Right atrium"],
      ["B", "左心房 Left atrium"],
      ["C", "右心室 Right ventricle"],
      ["D", "左心室 Left ventricle"],
      ["E", "大動脈 Aorta"],
      ["F", "肺動脈幹 Pulmonary trunk"]
    ]
  },
  posterior: {
    name:"心臟後面觀 Posterior view",
    img:"posterior.jpg",
    pairs:[
      ["A", "大動脈 Aorta"],
      ["B", "肺動脈 Pulmonary arteries"],
      ["C", "心尖 Apex"],
      ["D", "上腔靜脈 Superior vena cava"],
      ["E", "肺靜脈 Pulmonary veins"]
    ]
  },
  chambers: {
    name:"心臟腔室 Chambers of heart",
    img:"chambers.jpg",
    pairs:[
      ["A", "右心房 Right atrium"],
      ["B", "左心房 Left atrium"],
      ["C", "右心室 Right ventricle"],
      ["D", "左心室 Left ventricle"]
    ]
  },
  valves: {
    name:"心臟瓣膜 Heart valves",
    img:"valves.jpg",
    pairs:[
      ["A", "二尖瓣 Bicuspid valve"],
      ["B", "三尖瓣 Tricuspid valve"],
      ["C", "大動脈半月瓣 Aortic semilunar valve"],
      ["D", "肺動脈半月瓣 Pulmonary semilunar valve"]
    ]
  },
  vessels: {
    name:"心臟主要大血管 Major vessels",
    img:"vessels.jpg",
    pairs:[
      ["A", "升主動脈 Ascending aorta"],
      ["B", "大動脈弓 Aortic arch"],
      ["C", "頭臂動脈幹 Brachiocephalic trunk"],
      ["D", "左總頸動脈 Left common carotid artery"],
      ["E", "左鎖骨下動脈 Left subclavian artery"],
      ["F", "上腔靜脈 Superior vena cava"],
      ["G", "肺動脈幹 Pulmonary trunk"]
    ]
  },
  coronaryA: {
    name:"冠狀動脈供血 Coronary arterial",
    img:"coronaryA.jpg",
    pairs:[
      ["A", "升主動脈 Ascending aorta"],
      ["B", "左冠狀動脈 Left coronary artery"],
      ["C", "前室間動脈 Anterior interventricular artery"],
      ["D", "右冠狀動脈 Right coronary artery"]
    ]
  },
  coronaryV: {
    name:"冠狀靜脈回流 Coronary venous",
    img:"coronaryV.jpg",
    pairs:[
      ["A", "冠狀靜脈竇 Coronary sinus"],
      ["B", "冠狀靜脈竇開口 Opening of the coronary sinus"],
      ["C", "右心房 Right atrium"]
    ]
  },
  myocardium:{
    name:"心肌 Myocardium",
    img:"myocardium.jpg",
    pairs:[
      ["A","心內膜 Endocardium"],
      ["B","心肌層 Myocardium"],
      ["C","心外膜 Epicardium"],
      ["D","心房心肌 Atrial myocardium"],
      ["E","心室心肌 Ventricular myocardium"]
    ]
  },
  conduction:{
    name:"心臟傳導系統",
    img:"conduction.jpg",
    pairs:[
      ["A","竇房結 SA node（起搏點）"],
      ["B","房室結 AV node"],
      ["C","希氏束 Bundle of His"],
      ["D","左束支 Left bundle branch"],
      ["E","右束支 Right bundle branch"],
      ["F","浦肯野纖維 Purkinje fibres"]
    ]
  },
  pericardium:{
    name:"心包 Pericardium",
    img:"pericardium.jpg",
    pairs:[
      ["A","纖維心包 Fibrous pericardium"],
      ["B","漿膜心包壁層 Parietal serous pericardium"],
      ["C","心包腔 Pericardial cavity（含心包液）"],
      ["D","漿膜心包臟層 Visceral serous pericardium / 心外膜"]
    ]
  }
};

const setSelect = document.getElementById("set");
const lettersEl = document.getElementById("letters");
const namesEl = document.getElementById("names");
const statusEl = document.getElementById("status");
const diagramImg = document.getElementById("diagramImg");
const timerEl = document.getElementById("timer");
const attemptCountEl = document.getElementById("attemptCount");
const resultPanel = document.getElementById("resultPanel");

let selectedLetter = null;
let selectedName = null;
let matched = new Set();
let wrongPair = [];
let wrongList = [];
let startTime = null;
let timerInterval = null;
let totalAttempts = 0;

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function formatTime(seconds){
  const min = String(Math.floor(seconds/60)).padStart(2,"0");
  const sec = String(seconds%60).padStart(2,"0");
  return `${min}:${sec}`;
}

function updateTimer(){
  if(!startTime) return;
  const sec = Math.floor((Date.now() - startTime)/1000);
  timerEl.textContent = formatTime(sec);
}

function startRound() {
  selectedLetter = null;
  selectedName = null;
  matched = new Set();
  wrongPair = [];
  wrongList = [];
  totalAttempts = 0;
  attemptCountEl.textContent = totalAttempts;
  resultPanel.style.display = "none";

  const currentSet = sets[setSelect.value];
  const pairs = currentSet.pairs;

  diagramImg.src = currentSet.img;
  diagramImg.alt = currentSet.name + " 解剖圖";

  lettersEl.replaceChildren();
  namesEl.replaceChildren();

  pairs.forEach(([letter]) => {
    const button = makeButton(letter, "letter");
    lettersEl.append(button);
  });

  shuffle(pairs).forEach(([letter, name]) => {
    const button = makeButton(name, "name");
    button.dataset.answer = letter;
    namesEl.append(button);
  });

  if(timerInterval) clearInterval(timerInterval);
  startTime = Date.now();
  timerEl.textContent = "00:00";
  timerInterval = setInterval(updateTimer, 1000);

  updateStatus();
}

function makeButton(text, type) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "item";
  button.textContent = text;
  button.dataset.type = type;
  button.addEventListener("click", () => choose(button));
  return button;
}

function choose(button) {
  if (button.classList.contains("matched")) return;

  if (button.dataset.type === "letter") {
    document.querySelectorAll('[data-type="letter"]').forEach(el => el.classList.remove("selected"));
    selectedLetter = button.textContent;
    button.classList.add("selected");
  } else {
    document.querySelectorAll('[data-type="name"]').forEach(el => el.classList.remove("selected"));
    selectedName = button;
    button.classList.add("selected");
  }

  if (selectedLetter && selectedName) checkPair();
}

function checkPair() {
  totalAttempts +=1;
  attemptCountEl.textContent = totalAttempts;

  const letterButton = [...document.querySelectorAll('[data-type="letter"]')]
    .find(el => el.textContent === selectedLetter);
  const letter = selectedLetter;
  const nameText = selectedName.textContent;

  if (selectedName.dataset.answer === selectedLetter) {
    letterButton.classList.remove("selected");
    selectedName.classList.remove("selected");
    letterButton.classList.add("matched");
    selectedName.classList.add("matched");
    matched.add(selectedLetter);
    statusEl.textContent = "答對了！";
    statusEl.style.color = "#17633a";
  } else {
    letterButton.classList.add("wrong");
    selectedName.classList.add("wrong");
    wrongPair = [letterButton, selectedName];
    wrongList.push({letter, name:nameText});
    statusEl.textContent = "還不對，再試一次。";
    statusEl.style.color = "#b42318";
    setTimeout(() => {
      wrongPair.forEach(el => el.classList.remove("wrong", "selected"));
      wrongPair = [];
    }, 650);
  }

  selectedLetter = null;
  selectedName = null;
  setTimeout(updateStatus, 700);
}

function showResult(){
  clearInterval(timerInterval);
  const total = sets[setSelect.value].pairs.length;
  const correct = matched.size;
  const wrong = wrongList.length;
  const score = Math.round((correct/total)*100);
  const usedSec = Math.floor((Date.now() - startTime)/1000);

  document.getElementById("qTotal").textContent = total;
  document.getElementById("qCorrect").textContent = correct;
  document.getElementById("totalAttempts").textContent = totalAttempts;
  document.getElementById("score").textContent = score;
  document.getElementById("usedTime").textContent = formatTime(usedSec);

  const wrongListEl = document.getElementById("wrongList");
  wrongListEl.innerHTML = "";
  if(wrongList.length ===0){
    wrongListEl.innerText = "無錯題，全部正確🎉";
  }else{
    wrongList.forEach(item=>{
      const p = document.createElement("p");
      p.textContent = `${item.letter} 錯配：${item.name}`;
      wrongListEl.appendChild(p);
    })
  }
  resultPanel.style.display = "block";
}

function updateStatus() {
  const total = sets[setSelect.value].pairs.length;
  if (matched.size === total) {
    statusEl.textContent = `全部答對！${matched.size}／${total}`;
    statusEl.style.color = "#17633a";
    setTimeout(showResult, 600);
  } else {
    statusEl.textContent = `已配對 ${matched.size}／${total}`;
    statusEl.style.color = "#182230";
  }
}

document.getElementById("restart").addEventListener("click", startRound);
setSelect.addEventListener("change", startRound);

document.getElementById("showAnswers").addEventListener("click", () => {
  const currentSet = sets[setSelect.value];
  const pairs = currentSet.pairs;
  statusEl.textContent = pairs.map(([letter, name]) => `${letter}＝${name}`).join("　｜　");
  statusEl.style.color = "#2868bd";
});

startRound();
</script>
</body>
</html>
